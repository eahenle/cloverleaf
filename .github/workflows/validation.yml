name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Canonical validation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      UV_LOCKED: '1'
      CLOVERLEAF_LIVE_CODEX: '0'
      CLOVERLEAF_PROJECTS_REMOTE: ''
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.23'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install TeX Live and initialize PDFLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          sudo fmtutil-sys --byfmt pdflatex
          test -s "$(kpsewhich pdflatex.fmt)"
          pdflatex --version
          latexmk --version

      - name: Install locked project dependencies
        run: |
          uv sync --locked --all-extras
          npm --prefix frontend ci

      - name: Install Playwright Chromium and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the canonical validation gate
        run: ./dev-and-run --check-only 2>&1 | tee validation.log

      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            validation.log
            workspace/*.log
            frontend/test-results/
            frontend/playwright-report/
            screenshots/*.png
